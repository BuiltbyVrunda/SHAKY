<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shake Detection Feature</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      margin-top: 50px;
      transition: background-color 0.3s ease;
    }
    h2 {
      color: #333;
    }
    #status {
      margin-top: 20px;
      color: #555;
    }
  </style>
</head>
<body>
  <h2>Shake Detection Active 📱</h2>
  <p>Shake your phone to trigger an event 🎯</p>
  <p id="status">Waiting for motion permission...</p>

  <!-- Include Shake.js -->
  <script src="shake.js"></script>

  <script>
    async function requestMotionPermission() {
      try {
        // iOS needs explicit user permission
        if (typeof DeviceMotionEvent.requestPermission === "function") {
          const response = await DeviceMotionEvent.requestPermission();
          if (response !== "granted") {
            document.getElementById("status").innerText =
              "⚠️ Please allow motion access for shake detection to work.";
            return;
          }
        }
        startShakeDetection();
      } catch (err) {
        console.error("Permission error:", err);
        document.getElementById("status").innerText =
          "⚠️ Motion access denied or not supported.";
      }
    }

    function startShakeDetection() {
      document.getElementById("status").innerText =
        "✅ Shake detection is active. Shake your phone!";

      // Create Shake instance from shake.js
      const myShake = new Shake({ threshold: 10, timeout: 500 });
      myShake.start();

      // Listen for shake events
      window.addEventListener("shake", () => {
        const intensity = Math.floor(Math.random() * 50) + 20; // fake intensity
        console.log("💥 Shake detected! Intensity:", intensity);

        flashBackground();
        sendShakeToBackend(intensity);
      });
    }

    function flashBackground() {
      document.body.style.backgroundColor = "#a3ffaf";
      setTimeout(() => (document.body.style.backgroundColor = "white"), 300);
    }

    async function sendShakeToBackend(intensity) {
      try {
        await fetch("http://localhost:3000/shake", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            time: new Date().toISOString(),
            intensity: intensity,
          }),
        });
        console.log("✅ Shake logged to backend");
      } catch (err) {
        console.error("❌ Error sending to backend:", err);
      }
    }

    // Automatically request permission on page load
    window.addEventListener("load", requestMotionPermission);
  </script>
</body>
</html>
