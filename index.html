<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shake SOS Detector</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
      background-color: #f9f9f9;
      transition: background-color 0.3s ease;
    }
    button {
      padding: 15px 25px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #0056b3;
    }
    #sosButton {
      background-color: #dc3545;
    }
    #sosButton:hover {
      background-color: #a71d2a;
    }
  </style>
</head>
<body>
  <h1>🚨 Shake Detection SOS System</h1>
  <button id="enableMotion">Enable Motion Sensor</button>
  <button id="sosButton" style="display:none;">🚨 Cancel SOS</button>
  <p id="status">Waiting for motion permission...</p>

  <!-- Load the shake library first -->
  <script src="shake.js"></script>
  <!-- Load your SOS logic -->
  <script src="sos.js"></script>
</body>
</html>
