<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shake SOS WhatsApp</title>
  <script defer src="shake.js"></script>
  <script defer src="sos.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101010;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    button {
      background: #ff4d4d;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
      margin-top: 20px;
    }
    button:hover {
      background: #ff1a1a;
    }
    h1 {
      color: #ff8080;
    }
  </style>
</head>
<body>
  <h1>🚨 WhatsApp SOS System</h1>
  <button id="enableMotion">Enable Shake Detection</button>
  <button id="sendSOS">Send SOS Now</button>
  <p id="status">Waiting for motion access...</p>
</body>
</html>
