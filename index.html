<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHAKY — Real Shake Detection</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      background: linear-gradient(135deg, #c9d6ff, #e2e2e2);
      transition: background 0.4s ease;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    button {
      background-color: #4caf50;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease, background 0.3s ease;
    }

    button:hover {
      background-color: #45a049;
      transform: scale(1.05);
    }

    #status {
      margin-top: 20px;
      font-size: 1.2rem;
      color: #333;
    }

    #intensity {
      font-size: 1.4rem;
      color: #16a34a;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>📱 Shaky Motion Detector</h1>
  <button id="enableBtn">Enable Shake Detection</button>
  <div id="status">Waiting for permission...</div>
  <div id="intensity"></div>

  <script>
    let shakeData = [];

    async function requestMotionPermission() {
      const statusText = document.getElementById("status");

      // iOS Safari requires explicit permission
      if (typeof DeviceMotionEvent.requestPermission === "function") {
        try {
          const response = await DeviceMotionEvent.requestPermission();
          if (response === "granted") {
            startShakeDetection();
            statusText.textContent = "Permission granted ✅ Shake your phone!";
          } else {
            alert("Permission denied! Please allow motion access.");
            statusText.textContent = "Permission denied ❌";
          }
        } catch (error) {
          alert("Error requesting permission: " + error);
          statusText.textContent = "Error requesting permission ❌";
        }
      } else {
        // Android or other browsers
        startShakeDetection();
        statusText.textContent = "Shake detection started ✅";
      }
    }

    function startShakeDetection() {
      const intensityDisplay = document.getElementById("intensity");

      window.addEventListener("devicemotion", (e) => {
        const acc = e.accelerationIncludingGravity || e.acceleration;
        if (!acc) return;

        const x = acc.x || 0;
        const y = acc.y || 0;
        const z = acc.z || 0;
        const intensity = Math.sqrt(x * x + y * y + z * z).toFixed(2);

        // Record shake data with timestamp
        const timestamp = new Date().toISOString();
        shakeData.push({ time: timestamp, intensity: intensity });

        if (intensity > 12) {
          console.log("💥 Shake detected! Intensity:", intensity);
          intensityDisplay.textContent = "💥 Intensity: " + intensity;
          document.body.style.background = "radial-gradient(circle, #b8ffb5, #e2e2e2)";
          setTimeout(() => {
            document.body.style.background = "linear-gradient(135deg, #c9d6ff, #e2e2e2)";
          }, 700);
        }
      });
    }

    // Button click starts permission flow
    document.getElementById("enableBtn").addEventListener("click", requestMotionPermission);
  </script>
</body>
</html>
