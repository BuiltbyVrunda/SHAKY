<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shake + SOS Feature</title>
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
      margin-top: 50px;
      transition: background-color 0.5s ease;
    }
    #sosButton {
      display: none;
      background-color: red;
      color: white;
      font-size: 18px;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      margin-top: 20px;
      cursor: pointer;
    }
    #enableMotion {
      background-color: #007bff;
      color: white;
      font-size: 16px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Shake Detection + SOS</h2>
  <p>Shake your phone to trigger an emergency alert ⚠️</p>
  
  <button id="enableMotion">Enable Motion Access</button>
  <button id="sosButton">🚨 SOS Now</button>

  <script src="shake.js"></script>
</body>
</html>
