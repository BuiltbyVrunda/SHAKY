<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shake Detection Feature</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      margin-top: 50px;
      transition: background-color 0.3s ease;
    }
    h2 {
      color: #333;
    }
    #status {
      margin-top: 20px;
      color: #555;
    }
  </style>
</head>
<body>
  <h2>Shake Detection Active 📱</h2>
  <p>Shake your phone to trigger an event 🎯</p>
  <p id="status">Waiting for motion permission...</p>

  <script>
    async function requestMotionPermission() {
      try {
        // iOS requires explicit user permission
        if (typeof DeviceMotionEvent.requestPermission === "function") {
          const response = await DeviceMotionEvent.requestPermission();
          if (response !== "granted") {
            document.getElementById("status").innerText =
              "⚠️ Please allow motion access for shake detection to work.";
            return;
          }
        }

        // Start listening for motion
        startShakeDetection();
      } catch (err) {
        console.error("Permission error:", err);
        document.getElementById("status").innerText =
          "⚠️ Motion access denied or not supported.";
      }
    }

    function startShakeDetection() {
      let lastX = 0,
        lastY = 0,
        lastZ = 0;
      let lastTime = Date.now();

      document.getElementById("status").innerText =
        "✅ Shake detection is active. Shake your phone!";

      window.addEventListener("devicemotion", (event) => {
        const acc = event.accelerationIncludingGravity;
        if (!acc) return;

        const currentTime = Date.now();
        const timeDiff = currentTime - lastTime;

        if (timeDiff > 100) {
          const deltaX = Math.abs(acc.x - lastX);
          const deltaY = Math.abs(acc.y - lastY);
          const deltaZ = Math.abs(acc.z - lastZ);

          const shakeIntensity = deltaX + deltaY + deltaZ;

          if (shakeIntensity > 25) {
            console.log("💥 Shake detected! Intensity:", shakeIntensity.toFixed(2));
            flashBackground();
            sendShakeToBackend(shakeIntensity);
          }

          lastX = acc.x;
          lastY = acc.y;
          lastZ = acc.z;
          lastTime = currentTime;
        }
      });
    }

    function flashBackground() {
      document.body.style.backgroundColor = "#a3ffaf";
      setTimeout(() => {
        document.body.style.backgroundColor = "white";
      }, 300);
    }

    async function sendShakeToBackend(intensity) {
      try {
        await fetch("https://your-backend-url.com/shake", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            time: new Date().toISOString(),
            intensity: intensity.toFixed(2),
          }),
        });
        console.log("Shake event sent to backend successfully");
      } catch (err) {
        console.error("Error sending to backend:", err);
      }
    }

    // 🔹 Automatically request permission on page load
    window.addEventListener("load", requestMotionPermission);
  </script>
</body>
</html>
