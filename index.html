<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shake Detection SOS</title>
  <script defer src="shake.js"></script>
  <script defer src="sos.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    button {
      padding: 12px 24px;
      margin: 12px;
      border: none;
      border-radius: 8px;
      background: #ff4d4d;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #ff1a1a;
    }

    h1 {
      color: #ff6666;
    }

    #status {
      margin-top: 20px;
      color: #0f0;
    }
  </style>
</head>
<body>
  <h1>🚨 Shake Detection SOS System</h1>
  <button id="enableMotion">Enable Motion Sensors</button>
  <button id="sosBtn">Send SOS Now</button>
  <p id="status">Waiting for motion permission...</p>
</body>
</html>
